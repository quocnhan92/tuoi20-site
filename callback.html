<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Kết quả kết nối — Tuoi20 Studio</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header><a class="brand" href="./">tuoi20<span> / studio</span></a></header>
  <main class="form">
    <p class="eyebrow">TikTok / OAuth callback</p>
    <h1 id="heading">Kiểm tra kết nối</h1>
    <p id="status" class="status" role="status">Đang kiểm tra phản hồi…</p>
    <button id="copy" hidden>Sao chép mã kết nối</button>
    <button id="download" hidden>Tải file kết nối</button>
    <p id="copy-status" class="status" role="status" hidden></p>
    <p>Mã kết nối chỉ dùng một lần. Dán vào lệnh <code>finish-paste</code> trong Terminal trên máy đã bắt đầu phiên; không gửi mã lên GitHub hoặc vào chat.</p>
  </main>
  <footer><a href="./">← Trang chủ</a></footer>
  <script src="oauth.js"></script>
</body>
</html>
